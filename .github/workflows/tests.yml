name: comesy database integration tests
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: comesy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, iconv, fileinfo, curl, dom, xml
          coverage: none
      - name: Lint PHP and JavaScript
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/editor.js
          node --check assets/ui.js
          node --check assets/admin-pages-v2.js
          node tests/theme-contrast.mjs
          php tests/import-parser.php
      - name: Run isolated MySQL integration checks
        env:
          COMESY_TEST_DB: comesy_test
          COMESY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=comesy_test;charset=utf8mb4
          COMESY_TEST_USER: root
          COMESY_TEST_PASSWORD: test_password
        run: php tests/integration.php
      - name: Install headless UI test runner
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Test HTTP login and multisite publishing
        env:
          COMESY_TEST_DB: comesy_test
          COMESY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=comesy_test;charset=utf8mb4
          COMESY_TEST_USER: root
          COMESY_TEST_PASSWORD: test_password
        run: |
          php -r 'file_put_contents("app/config.php", "<?php return ".var_export(["db_host"=>"127.0.0.1","db_name"=>"comesy_test","db_user"=>"root","db_pass"=>"test_password","setup_key"=>""], true).";");'
          php -S 127.0.0.1:8765 -t . > /tmp/comesy-php-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; rm -f app/config.php' EXIT
          sleep 2
          python3 tests/http-smoke.py || { cat /tmp/comesy-php-test.log; exit 1; }
          node tests/browser-smoke.mjs || { cat /tmp/comesy-php-test.log; exit 1; }
          node tests/all-admin-pages.mjs || { cat /tmp/comesy-php-test.log; exit 1; }
      - name: Upload desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comesy-admin-ui-preview
          path: ui-preview/*.png
          if-no-files-found: ignore
