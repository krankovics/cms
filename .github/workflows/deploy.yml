name: Deploy CMS via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cms-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"

      - name: Prepare public release
        run: |
          mkdir -p deploy
          cp index.php login.php logout.php setup.php profile.php avatar.php editor.php articles.php migrate.php settings.php taxonomy.php media.php media-file.php editor-upload.php site-permissions.php sites.php users.php ads.php ad-slot.php ad-click.php imports.php import-worker.php import-worker.sh import-report.php api-v1.php builder.php public.php audit.php publish-worker.php deploy/
          mkdir -p deploy/app/avatars deploy/database deploy/assets deploy/storage/media deploy/storage/import
          cp app/bootstrap.php app/header.php app/site-access.php app/article-sites.php app/taxonomy-actions.php app/user-actions.php app/ad-actions.php app/import-engine.php app/rich-content.php app/import-jobs.php app/import-worker.php app/import-health.php app/site-settings.php app/layouts.php app/.htaccess deploy/app/
          cp app/avatars/.htaccess deploy/app/avatars/
          cp assets/ui.css assets/admin-v2.css assets/admin-pages-v2.css assets/admin-secondary-v2.css assets/dashboard-v2.css assets/ui.js assets/admin-pages-v2.js assets/editor.js assets/login.css assets/setup.css assets/ads.css assets/imports.css assets/builder.css assets/builder.js assets/public.css assets/audit.css deploy/assets/
          cp database/schema.sql database/editor.sql database/content.sql database/site-permissions.sql database/ads.sql database/import.sql database/import-metrics.sql database/layouts.sql deploy/database/
          printf 'Require all denied\nDeny from all\n' > deploy/database/.htaccess
          php -l deploy/index.php
          php -l deploy/login.php
          php -l deploy/setup.php
          php -l deploy/profile.php
          php -l deploy/avatar.php
          php -l deploy/editor.php
          php -l deploy/articles.php
          php -l deploy/migrate.php
          php -l deploy/settings.php
          php -l deploy/taxonomy.php
          php -l deploy/media.php
          php -l deploy/media-file.php
          php -l deploy/editor-upload.php
          php -l deploy/site-permissions.php
          php -l deploy/sites.php
          php -l deploy/users.php
          php -l deploy/ads.php
          php -l deploy/ad-slot.php
          php -l deploy/ad-click.php
          php -l deploy/app/ad-actions.php
          php -l deploy/imports.php
          php -l deploy/import-report.php
          php -l deploy/import-worker.php
          php -l deploy/api-v1.php
          php -l deploy/builder.php
          php -l deploy/public.php
          php -l deploy/audit.php
          php -l deploy/publish-worker.php
          php -l deploy/app/layouts.php
          php -l deploy/app/site-settings.php
          php -l deploy/app/import-engine.php
          php -l deploy/app/rich-content.php
          php -l deploy/app/import-jobs.php
          php -l deploy/app/import-worker.php
          php -l deploy/app/import-health.php
          php -l deploy/app/user-actions.php
          php -l deploy/app/taxonomy-actions.php
          php -l deploy/app/article-sites.php
          php -l deploy/app/site-access.php
          php -l deploy/app/bootstrap.php
          php -l deploy/app/header.php
          node --check deploy/assets/editor.js
          node --check deploy/assets/ui.js
          node --check deploy/assets/admin-pages-v2.js
          printf 'Require all denied\nDeny from all\nOptions -Indexes\n' > deploy/storage/media/.htaccess
          printf 'Require all denied\nDeny from all\nOptions -Indexes\n' > deploy/storage/import/.htaccess

      - name: Generate protected PHP configuration
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          COMESY_SETUP_KEY: ${{ secrets.COMESY_SETUP_KEY }}
        run: |
          test -n "$DB_NAME"
          test -n "$DB_USER"
          php -r '$c = ["db_host"=>"localhost","db_name"=>getenv("DB_NAME"),"db_user"=>getenv("DB_USER"),"db_pass"=>getenv("DB_PASS"),"setup_key"=>getenv("COMESY_SETUP_KEY")];file_put_contents("deploy/app/config.php","<?php".PHP_EOL."return ".var_export($c,true).";".PHP_EOL);'
          php -l deploy/app/config.php

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
