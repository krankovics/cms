name: Deploy CMS via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cms-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"

      - name: Prepare public release
        run: |
          mkdir -p deploy
          cp index.php login.php logout.php setup.php profile.php avatar.php editor.php articles.php migrate.php deploy/
          mkdir -p deploy/app/avatars deploy/database deploy/assets
          cp app/bootstrap.php app/.htaccess deploy/app/
          cp app/avatars/.htaccess deploy/app/avatars/
          cp assets/ui.css assets/ui.js deploy/assets/
          cp database/schema.sql database/editor.sql deploy/database/
          printf 'Require all denied\nDeny from all\n' > deploy/database/.htaccess
          php -l deploy/index.php
          php -l deploy/login.php
          php -l deploy/setup.php
          php -l deploy/profile.php
          php -l deploy/avatar.php
          php -l deploy/editor.php
          php -l deploy/articles.php
          php -l deploy/migrate.php
          php -l deploy/app/bootstrap.php

      - name: Generate protected PHP configuration
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          COMESY_SETUP_KEY: ${{ secrets.COMESY_SETUP_KEY }}
        run: |
          test -n "$DB_NAME"
          test -n "$DB_USER"
          php -r '$c = ["db_host"=>"localhost","db_name"=>getenv("DB_NAME"),"db_user"=>getenv("DB_USER"),"db_pass"=>getenv("DB_PASS"),"setup_key"=>getenv("COMESY_SETUP_KEY")];file_put_contents("deploy/app/config.php","<?php".PHP_EOL."return ".var_export($c,true).";".PHP_EOL);'
          php -l deploy/app/config.php

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
